<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Knowledgebase Semantic Search & RAG</title>
    <script type="module" src="app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        input, button { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 10px; }
        input[type="text"] { width: 75%; }
        input[type="password"] { width: 100%; box-sizing: border-box; }
        button { background: #238636; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        .result-box { border: 1px solid #e1e4e8; padding: 15px; margin: 15px 0; border-radius: 6px; background: #fafbfc; }
        #llm-response { background: #f0f7ff; padding: 15px; border-left: 5px solid #0052cc; margin-top: 20px; border-radius: 4px; font-style: italic; }
        .source-tag { font-size: 12px; background: #e1f5fe; color: #0288d1; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>📚 Controlled Knowledgebase AI Search</h2>
    
    <label for="apiKey"><strong>Hugging Face API Token (Optional for RAG summary):</strong></label>
    <input type="password" id="apiKey" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxx">
    
    <div style="margin-top: 20px;">
        <input type="text" id="query" placeholder="Ask a question about your documents...">
        <button id="searchBtn">Ask AI</button>
    </div>

    <h3>🤖 AI Generated Summary (RAG):</h3>
    <div id="llm-response">App ready. Type a query above to search.</div>

    <h3>🔍 Top Semantic Source Matches:</h3>
    <div id="results">No matches found yet.</div>
</body>
</html>
